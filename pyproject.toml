[tool.poetry]
name = "trialsentinel"
version = "1.0.0"
description = "Predict early termination of Phase 2/3 clinical trials from their registration-time design, with SHAP explanations."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "trialsentinel", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = "^3.0"
numpy = "^2.0"
pyarrow = ">=18"
scikit-learn = "^1.7"
imbalanced-learn = ">=0.13"
lightgbm = "^4.5"
xgboost = "^3.0"
catboost = "^1.2"
optuna = ">=4.0"
shap = ">=0.48"
statsmodels = ">=0.14"
joblib = "^1.4"
matplotlib = "^3.9"
seaborn = "^0.13"

[tool.poetry.group.api.dependencies]
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }
pydantic = "^2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = ">=0.27"
jupyter = "^1.1"
nbconvert = "^7.16"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
